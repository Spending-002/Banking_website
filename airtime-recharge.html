<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airtime Recharge</title>
    <link rel="stylesheet" href="airtime-recharge.css">
  </head>
  <body>
    <div class="header">
      <img onclick="history.back()" src="icon/backarrow white.png" style="width: 20px; height: 20px;">
      <h4>Airtime</h4>
      <h5>History</h5>
    </div>
  
    
    
    
    <div class="airtime-container">
      <div id="airtime-type">
        <div class="type"></div>
      
      </div>
      
      <div id="airtime-body">
        <h4 class="h4"><span style="padding-right: 5px;">+234</span>
        </h4>
       <input type="tel" id="airtime-number">
      </div>
      
    <div id="select-contact">
     <div class="contact-icon"></div>
      </div>
  </div>
  
  
   <div class="price-container">
     <input type="tel" id="price" placeholder="&#8358 50-200,000">
     <button>Pay</button>
    </div>
    
    
    <div class="top-up">
     <div class="top-up-nav"><span>&#8358</span>50
     <div class="cash-back"><span>&#8358</span> 0.5 Cashback</div>
     </div>
     
     <div class="top-up-nav"><span>&#8358</span>100
      <div class="cash-back"><span>&#8358</span>1 Cashback</div>
     </div>
     
     <div class="top-up-nav"><span>&#8358</span>200
     <div class="cash-back"><span>&#8358</span>2 Cashback</div>
     </div>
     
     <div class="top-up-nav"><span>&#8358</span>500
     <div class="cash-back"><span>&#8358</span>5 Cashback</div>
     </div>
     
     <div class="top-up-nav"><span>&#8358</span>1,000
     <div class="cash-back"><span>&#8358</span>10 Cashback</div>
     </div>
     
     <div class="top-up-nav"><span>&#8358</span>2,000
    <div class="cash-back"><span>&#8358</span>20 Cashback</div>
     </div>

    </div>
  </body>
</html>
