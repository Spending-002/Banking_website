<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index Page</title>
    <link rel="stylesheet" href="index.css">
    <style>
  body{
    margin: 0;
    font-family: Arial, Comic Sans MS;
 }
   #signLogin-container{
     width: 100%;
     height: 100dvh;
     perspective: 1000px;
     overflow: hidden;
  }
  .cards {
  width: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.6s;
}
.cards.flip {
  transform: rotateY(180deg);
}

  #signLogin-body, #signUp-body{
    position: absolute;
    width: 100%;
    height: 100vh;
    border: 1px solid white;
    box-sizing: border-box;
    background: whitesmoke;
    box-shadow: 0 0 8px lightblue;
    backface-visibility: hidden;
  }
   #signUp-body{
    transform: rotateY(180deg);
  }
  .logo{
    text-align: center;
    font-size: 35px;
    font-family: Arial, Sans-Serif;
    font-weight: bold;
    color: navy;
    transform: rotate(-10deg);
    margin: 30px 0px 50px;
  }
  .input-wrapper{
    position: relative;
    margin: 20px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  
.input-wrapper input{
    width: 100%;
    height: 30px;
    outline: none;
    padding: 3px 10px;
    font-size: 18px;
    font-family: Arial,Sans-Serif;
    background: navy;
    color: white;
    border-radius: 8px;
    border: none;
  }

.input-wrapper label {
  position: absolute;
  left: 0px;
  top: 50%;
  transform: translateY(-50%);
  color: white;
  pointer-events: none;
  transition: 0.3s ease;
  background: navy;
  padding: 0 4px;
}
/* when input is focused OR has value */
.input-wrapper input:focus + label,
.input-wrapper input:not(:placeholder-shown) + label {
  top: -10px;
  left: -6px;
  font-size: 17px;
  font-weight: bold;
  color: black;
  background: whitesmoke;
}
  label{
    font-size: 16px;
    margin-right: auto;
    margin-bottom: 5px;
    color: white;
  }
  button{
    padding:  5px 40px;
    border-radius: 9px;
    border: 1px solid navy;
    font-size: 18px;
    color: white;
    background: navy;
    box-shadow: 0 0 4px blue;
    display: flex;
    justify-self: center;
    margin-top: 50px;
  }
   .error-alert{
    display: flex;
    align-items: center;
    justify-content: center;
    transform: scale(0);
    transition: transform 0.3s ease, opacity 0.3s ease;
    padding: 5px;
    color:red ;
   } 
.error-alert.show {
  transform: scale(1.1);
  opacity: 1;
}
.strength-container {
  position: absolute;
  bottom: 10px;
  left: 0;
  width: 100%;
  height: 6px;
  background: #ddd;
  border-radius: 5px;
  overflow: hidden;
  margin-top: 30px;
  transition: 3s ease;
  opacity: 0;
}
.strength-container.width{
  opacity: 1;
}
#strength-bar {
  height: 100%;
  width: 0%;
  transition: width 0.3s ease;
}
#strength-text{
  position: absolute;
  bottom: -20px;
  left: 50%;
  transform: translate(-50%, -50%);
  margin: 0;
  font-family: Arial, Sans-Serif;
}
.successfulBox{
  position: fixed;
  top: 25%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100px;
  height: 100px;
  opacity: 0;
  pointer-events: none;
  transition: transform 0.2s;
}
.successfulBox img{
width: 100%;
height: 100%;
object-fit: cover;
border-radius: 100px;
}
.successBox-background{
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100dvh;
  background: rgb(0,0,0,0.1);
}
    </style>
  </head>
  <body>
   
<div id="signLogin-container">
  
  <div class="cards" id="cards">
  <div id="signLogin-body">
    
    <h3 class="logo">Payrr</h3>
    
    <div style="width: 100%; display: flex; align-items: center; flex-direction: column; gap: 30px;">
   <div class="input-wrapper">
    <input type="email" id="loginEmail" placeholder=" "  required>
    <label for="loginEmail">Email</label>
  </div>
       
   <div class="input-wrapper">
    <input type="password" id="loginPassword" placeholder=" " required>
    <label for="loginPassword">Password</label>
  </div>
    </div>
  <button type="submit" id="login">Login</button>
  
  <p style="text-align: center; flex: 1">Don't have account? 
  <span class="flipBtn" style="color: navy; font-size: 15px;">SignUp</span>
  </p>
</div>


  <div id="signUp-body">
    
    <h3 class="logo">Payrr</h3>
    
 <div style="width: 100%; display: flex; align-items: center; flex-direction: column; gap: 30px;">
   <div class="input-wrapper">
    <input type="text" id="fulName" placeholder=" " maxlength="30" required>
   <label for="fulName">Username</label>
    </div>
    
    <div class="input-wrapper">
    <input type="email" id="signUp-email" placeholder=" " required>
   <label for="signUp-email">Email</label>
    </div>
  
    <div style="position: relative; display: flex;">
   <div class="input-wrapper">
    <input type="password" id="create-password" maxlength="30"placeholder=" " required>
    <label for="create-password">Password</label>
  </div>
  
  <div class="strength-container">
     <div id="strength-bar"></div>
     </div>
  <p id="strength-text"></p>
  </div>
  </div>
    
  <button id="signUp">Create Account</button>
  
  <p style="text-align: center">Do you have account? 
  <span class="flipBtn" style="color: navy; font-size: 15px;">Login</span>
  </p>
   <div class="error-alert"></div>
   </div>
</div><!--card closing tags-->

<div class="successBox-background"></div>
<div class="successfulBox">
  <img src="icon/success.gif">
</div>

</div><!--App closing tag-->
  
    <script>
  const fulName = document.getElementById('fulName');
  const signEmail = document.getElementById('signUp-email');
  const signPassword = document.getElementById('create-password');
  const signUpBtn = document.getElementById('signUp');
  const error = document.querySelector('.error-alert');
  const successBox = document.querySelectorAll('.successfulBox');
  const backgroundCover = document.querySelector('.successBox-background');
  
  signUpBtn.addEventListener('click', ()=>{
    const userData = {
      name: fulName.value.trim(),
      email: signEmail.value.trim().toLowerCase(),
      password: signPassword.value.trim()
    };
    
    if(!userData.name){
     error.textContent = "please input your fullName";
     error.classList.add('show');
     setTimeout(()=>{
    error.classList.remove('show');
  }, 2000);
     return;
};
    if(!userData.email){
      error.classList.add('show');
     error.textContent = "please input your email";
    setTimeout(()=>{
    error.classList.remove('show');
  }, 2000);
      return;
    };
    if(!userData.password){
      error.classList.add('show');   
      error.textContent = "please input your password";
     setTimeout(()=>{
    error.classList.remove('show');
  }, 2000);
      return;
    };
   
    if(userData){
      signUpBtn.textContent = "Creating...";
      signUpBtn.style.fontSize = "16px";
     
      setTimeout(()=>{ 
       signUpBtn.textContent = "Loading..."; 
      },2000);
     
      
      setTimeout(()=>{
      signUpBtn.textContent = "Successful"; 
      backgroundCover.style.display = "block";
      successBox.forEach((success) =>{
       success.style.opacity = "1";
     });
     window.location.href = "home.html";
   }, 3000);
   
  };
    
    
});   

    fulName.value = "";
    signEmail.value = "";
    signPassword.value = "";
    error.textContent = "";
    

  fulName.addEventListener('input', ()=>{
    error.textContent = "";
    return;
  });
  signEmail.addEventListener('input', ()=>{
    error.textContent = "";
    return;
  });
  signPassword.addEventListener('input', ()=>{
    error.textContent = "";
    return;
  });

     const card = document.getElementById("cards");
     const flipBtn = document.querySelectorAll('.flipBtn');
     
     flipBtn.forEach((btn) =>{
     btn.addEventListener('click', ()=>{
     card.classList.toggle("flip");
     });
   });

const passwordInput = document.getElementById('create-password');
const strengthContainer = document.querySelector('.strength-container');
const strengthBar = document.getElementById('strength-bar');
const strengthText = document.getElementById('strength-text');

passwordInput.addEventListener('input', () => {
  checkStrength(passwordInput.value);
  strengthContainer.classList.add("width");
  
  if(passwordInput.value.length === 0){
    strengthContainer.classList.remove("width");
  }
  if(passwordInput.value.length > 30){
   strengthText.textContent = "Too long password.";
   strengthText.color = "red";
   return;
 }
});
 
let currentPasswordScore = 0;

function checkStrength(password) {
  let score = 0;

  if (password.length >= 8) score++;
  if (/[A-Z]/.test(password)) score++;
  if (/[0-9]/.test(password)) score++;
  if (/[^A-Za-z0-9]/.test(password)) score++;

  currentPasswordScore = score;

  // Empty input
  if (password.length === 0) {
    strengthBar.style.width = "0%";
    strengthText.textContent = "";
    return;
  }
  
  if (score <= 1) {
    strengthBar.style.width = "25%";
    strengthBar.style.background = "red";
    strengthText.style.color = "red";
    strengthText.textContent = "Weak";
  } 
  else if (score === 2) {
    strengthBar.style.width = "50%";
    strengthBar.style.background = "orange";
    strengthText.style.color = "orange";
    strengthText.textContent = "Fair";
  } 
  else if (score === 3) {
    strengthBar.style.width = "75%";
    strengthBar.style.background = "blue";
    strengthText.style.color = "blue";
    strengthText.textContent = "Good";
  } 
  else {
    strengthBar.style.width = "100%";
    strengthBar.style.background = "green";
    strengthText.style.color = "green";
    strengthText.textContent = "Strong";
  }
}
  
  
    </script>
  </body>
</html>
