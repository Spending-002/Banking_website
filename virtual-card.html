<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Virtual Card</title>
    <link rel="stylesheet" href="virtual-card.css">
  </head>
  <body>
    <div class="header">
    <img onclick="history.back()" src="icon/backarrow.png" style="width: 20px; height: 20px;">
    <h2>Card</h2>
  </div>
    
    <div class="card-container">
        <div class="virtual-card">
        <h3>Payrr</h3>
        <h4>Virtual Card</h4>
        <h5><span id="span">V</span> erve</h5>
        <div class="card-design">P</div>
        <div class="card-nav"></div>
        </div>
    </div>
    
    <button class="create-card">Create Card</button>
    
    <div class="card-content">
      <div class="content">
        <div class="content-nav" id="customize-card">
       <div class="icon" style="background-image: url('icon/customize.png');"></div>
        </div>
        <p>Customize Card</p>
        </div>
        
      <div class="content">
        <div class="content-nav">
      <div class="icon" style="background-image: url('icon/settings.png');"></div>
         </div>
        <p>Card Settings</p>
        </div>
        
      <div class="content">
        <div class="content-nav">
      <div class="icon" style="background-image: url('icon/card-type.png');"></div>
         </div>
        <p>Card Types</p>
        </div>
    </div>
    
    <div class="cards-container">
    <img class="cards" id="card-1" src="image/card-1.jpeg">
    
    <img class="cards" id="card-2" src="image/card-2.jpeg">
    
    <img class="cards" id="card-3" src="image/card-3.jpeg">
    
    <img class="cards" id="card-4" src="image/card-4.jpeg">
  
    <img class="cards" id="card-5" src="image/card-5.jpeg">
    </div>
    
    
    <script src="virtual-card.js" defer></script>
  </body>
</html>
