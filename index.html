<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index Page</title>
    <link rel="stylesheet" href="index.css">
    <style>
  body{
    margin: 0;
    font-family: Arial, Comic Sans MS;
 }
   #signLogin-container{
     width: 100%;
     height: 100dvh;
     perspective: 1000px;
     overflow: hidden;
  }
  .cards {
  width: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.6s;
}
.cards.flip {
  transform: rotateY(180deg);
}

  #signLogin-body, #signUp-body{
    position: absolute;
    width: 100%;
    height: 100vh;
    border: 1px solid white;
    box-sizing: border-box;
    background: whitesmoke;
    box-shadow: 0 0 8px lightblue;
    backface-visibility: hidden;
  }
   #signUp-body{
    transform: rotateY(180deg);
  }
  .logo{
    text-align: center;
    font-size: 35px;
    font-family: Arial, Sans-Serif;
    font-weight: bold;
    color: navy;
    transform: rotate(-10deg);
    margin: 30px 0px 50px;
  }
  .input-wrapper{
    position: relative;
    margin: 20px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  
.input-wrapper input{
    width: 100%;
    height: 30px;
    outline: none;
    padding: 3px 10px;
    font-size: 20px;
    font-family: Arial,Sans-Serif;
    background: navy;
    color: white;
    border-radius: 8px;
    border: none;
  }

.input-wrapper label {
  position: absolute;
  left: 0px;
  top: 50%;
  transform: translateY(-50%);
  color: white;
  pointer-events: none;
  transition: 0.3s ease;
  background: navy;
  padding: 0 4px;
}
/* when input is focused OR has value */
.input-wrapper input:focus + label,
.input-wrapper input:valid + label {
  top: -12px;
  left: 0px;
  font-size: 16px;
  color: navy;
  background: whitesmoke;
  font-weight: bold;
}
  label{
    font-size: 16px;
    margin-right: auto;
    margin-bottom: 5px;
    padding-left: 10x;
    color: white;
  }
  button{
    padding:  5px 40px;
    border-radius: 9px;
    border: 1px solid navy;
    font-size: 18px;
    color: white;
    background: navy;
    box-shadow: 0 0 4px blue;
    display: flex;
    justify-self: center;
    margin-top: 50px;
  }
   .error-alert{
    display: flex;
    align-items: center;
    justify-content: center;
    transform: rotate(180deg);
    transition: transform 0.4s;
    padding: 5px;
    color:red ;
    
   }   
    </style>
  </head>
  <body>
   
<div id="signLogin-container">
  
  <div class="cards" id="cards">
  <div id="signLogin-body">
    
    <h3 class="logo">Payrr</h3>
    
    <div style="width: 100%; display: flex; align-items: center; flex-direction: column; gap: 30px;">
   <div class="input-wrapper">
    <input type="email" id="loginEmail" placeholder=" "  required>
    <label for="loginEmail">Email</label>
  </div>
       
   <div class="input-wrapper">
    <input type="password" id="loginPassword" placeholder=" " required>
    <label for="loginPassword">Password</label>
  </div>
    </div>
  <button type="submit" id="login">Login</button>
  
  <p style="text-align: center; flex: 1">Don't have account? 
  <span class="flipBtn" style="color: navy; font-size: 15px;">SignUp</span>
  </p>
  
<div class="error-alert" id="login-email"></div>
</div>


  <div id="signUp-body">
    
    <h3 class="logo">Payrr</h3>
    
 <div style="width: 100%; display: flex; align-items: center; flex-direction: column; gap: 30px;">
   <div class="input-wrapper">
    <input type="text" id="fulName" placeholder=" " maxlength="20" required>
   <label for="fulName">FullName</label>
    </div>
    
    <div class="input-wrapper">
    <input type="email" id="signUp-email" placeholder=" " required>
   <label for="signUp-email">Email</label>
    </div>
    
   <div class="input-wrapper">
    <input type="password" id="create-password" placeholder=" " required>
    <label for="create-assword">Password</label>
  </div>
    </div>
    
  <button id="signUp">Create Account</button>
  
  <p style="text-align: center">Do you have account? 
  <span class="flipBtn" style="color: navy; font-size: 15px;">Login</span>
  </p>
  
  <div class="error-alert"></div>
</div>

</div>
</div>
    
    <script>
     const card = document.getElementById("cards");
     const flipBtn = document.querySelectorAll('.flipBtn');
     
     flipBtn.forEach((btn) =>{
     btn.addEventListener('click', ()=>{
     card.classList.toggle("flip");
     });
   });
   
  
   const loginEmail = document.getElementById('loginEmail');
   const loginPassword = document.getElementById('loginPassword');
   const loginBtn = document.getElementById('login');
   const errors = document.querySelectorAll('.error-alert');
   
   loginBtn.addEventListener('click', (e) =>{
   if(loginEmail.value.trim() === ''){
     e.preventDefault();
     errors.forEach((error) =>{
     error.textContent = "Invalid Email";
     error.style.transform = "rotate(360deg)";
  });
     return;
   }
   
   if(loginPassword.value.trim() === ''){
     errors.forEach((error) =>{
     error.textContent = "Invalid password";
     error.style.transform = "rotate(360deg)";
     });
     return;
   }
   });
   
   loginEmail.addEventListener('input', () => {
   errors.forEach((error) =>{
   error.textContent = '';
   });
});

setTimeout(function(){
  errors.forEach((error) =>{
     error.style.opacity = "0";
     error.style.transition = "4s ease";
     error.style.transform = "rotate(360deg)";
    });
   }, 2000);
   
  const fulname = document.getElementById('fulName');
  const email = document.getElementById('signUp-email');
  const password = document.getElementById('create-password');
  const signUp = document.getElementById('signUp');
  
  signUp.addEventListener('click', ()=>{
    if(fulname.value.trim() === ''){
      errors.forEach((error) =>{
     error.textContent = "Input fulname";
     error.style.transform = "rotate(360deg)";
     });
      return;
    }
  });
  
    </script>
  </body>
</html>
