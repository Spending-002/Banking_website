<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index Page</title>
    <link rel="stylesheet" href="index.css">
    <style>
  body{
    margin: 0;
    font-family: Arial, Comic Sans MS;
 }
   #signLogin-container{
     width: 100%;
     height: 100dvh;
     perspective: 1000px;
     overflow: hidden;
  }
  .cards {
  width: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.6s;
}
.cards.flip {
  transform: rotateY(180deg);
}

  #signLogin-body, #signUp-body{
    position: absolute;
    width: 100%;
    height: 100vh;
    border: 1px solid white;
    box-sizing: border-box;
    background: whitesmoke;
    box-shadow: 0 0 8px lightblue;
    backface-visibility: hidden;
  }
   #signUp-body{
    transform: rotateY(180deg);
  }
  .logo{
    text-align: center;
    font-size: 35px;
    font-family: Arial, Sans-Serif;
    font-weight: bold;
    color: navy;
    transform: rotate(-10deg);
    margin: 30px 0px 50px;
  }
  .input-wrapper{
    position: relative;
    margin: 20px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  
.input-wrapper input{
    width: 100%;
    height: 30px;
    outline: none;
    padding: 3px 10px;
    font-size: 20px;
    font-family: Arial,Sans-Serif;
    background: navy;
    color: white;
    border-radius: 8px;
    border: none;
  }

.input-wrapper label {
  position: absolute;
  left: 0px;
  top: 50%;
  transform: translateY(-50%);
  color: white;
  pointer-events: none;
  transition: 0.3s ease;
  background: navy;
  padding: 0 4px;
}
/* when input is focused OR has value */
.input-wrapper input:focus + label,
.input-wrapper input:valid + label {
  top: -12px;
  left: 0px;
  font-size: 16px;
  color: navy;
  background: whitesmoke;
  font-weight: bold;
}
  label{
    font-size: 16px;
    margin-right: auto;
    margin-bottom: 5px;
    padding-left: 10x;
    color: white;
  }
  button{
    padding:  5px 40px;
    border-radius: 9px;
    border: 1px solid navy;
    font-size: 18px;
    color: white;
    background: navy;
    box-shadow: 0 0 4px blue;
    display: flex;
    justify-self: center;
    margin-top: 50px;
  }
   .error-alert{
    display: flex;
    align-items: center;
    justify-content: center;
    transform: scale(0);
    transition: transform 0.3s ease, opacity 0.3s ease;
    padding: 5px;
    color:red ;
   } 
.error-alert.show {
  transform: scale(1.1);
  opacity: 1;
}
    </style>
  </head>
  <body>
   
<div id="signLogin-container">
  
  <div class="cards" id="cards">
  <div id="signLogin-body">
    
    <h3 class="logo">Payrr</h3>
    
    <div style="width: 100%; display: flex; align-items: center; flex-direction: column; gap: 30px;">
   <div class="input-wrapper">
    <input type="email" id="loginEmail" placeholder=" "  required>
    <label for="loginEmail">Email</label>
  </div>
       
   <div class="input-wrapper">
    <input type="password" id="loginPassword" placeholder=" " required>
    <label for="loginPassword">Password</label>
  </div>
    </div>
  <button type="submit" id="login">Login</button>
  
  <p style="text-align: center; flex: 1">Don't have account? 
  <span class="flipBtn" style="color: navy; font-size: 15px;">SignUp</span>
  </p>
</div>


  <div id="signUp-body">
    
    <h3 class="logo">Payrr</h3>
    
 <div style="width: 100%; display: flex; align-items: center; flex-direction: column; gap: 30px;">
   <div class="input-wrapper">
    <input type="text" id="fulName" placeholder=" " maxlength="20" required>
   <label for="fulName">FullName</label>
    </div>
    
    <div class="input-wrapper">
    <input type="email" id="signUp-email" placeholder=" " required>
   <label for="signUp-email">Email</label>
    </div>
    
   <div class="input-wrapper">
    <input type="password" id="create-password" placeholder=" " required>
    <label for="create-password">Password</label>
  </div>
    </div>
    
  <button id="signUp">Create Account</button>
  
  <p style="text-align: center">Do you have account? 
  <span class="flipBtn" style="color: navy; font-size: 15px;">Login</span>
  </p>
  
  <div class="error-alert"></div>
</div>

</div>
</div>
    
    <script>
  const fulName = document.getElementById('fulName');
  const signEmail = document.getElementById('signUp-email');
  const signPassword = document.getElementById('create-password');
  const signUpBtn = document.getElementById('signUp');
  const error = document.querySelector('.error-alert');
 
  signUpBtn.addEventListener('click', ()=>{
    const userData = {
      name: fulName.value.trim(),
      email: signEmail.value.trim().toLowerCase(),
      password: signPassword.value.trim()
    };
    if(!userData.name){
     error.textContent = "please input your fullName";
     error.classList.add('show');
     setTimeout(()=>{
    error.classList.remove('show');
  }, 2000);
     return;
  
  
    };
    
    if(userData.name.length > 20){
    error.classList.add('show');
    error.textContent = "Max 20 characters";
    setTimeout(()=>{
    error.classList.remove('show');
  }, 2000);
    return;
}

    if(!userData.email){
      error.classList.add('show');
     error.textContent = "please input your email";
    setTimeout(()=>{
    error.classList.remove('show');
  }, 2000);
      return;
    };
    
    if(!userData.password){
      error.classList.add('show');   
      error.textContent = "please input your password";
     setTimeout(()=>{
    error.classList.remove('show');
  }, 2000);
      return;
    };
     
    
   
    //Getting existing users
    let users = JSON.parse(localStorage.getItem('users')) || [];
    
    //Prevent duplicate emails
    const exists = users.some(user => user.email === userData.email);
    if(exists){
      alert('Email already registered.');
      return;
    }
    //Add new user
    users.push(userData);
    
    //Save back to localStorage
    localStorage.setItem('users', JSON.stringify(users));
    
    alert("Success");
    
    localStorage.setItem('currentUser', JSON.stringify(userData));
 
    fulName.value = "";
    signEmail.value = "";
    signPassword.value = "";
    error.textContent = "";
  });
  
  
  
  fulName.addEventListener('input', ()=>{
    error.textContent = "";
    return;
  });
  signEmail.addEventListener('input', ()=>{
    error.textContent = "";
    return;
  });
  signPassword.addEventListener('input', ()=>{
    error.textContent = "";
    return;
  });

  
     const card = document.getElementById("cards");
     const flipBtn = document.querySelectorAll('.flipBtn');
     
     flipBtn.forEach((btn) =>{
     btn.addEventListener('click', ()=>{
     card.classList.toggle("flip");
     });
   });


  
  
    </script>
  </body>
</html>
